<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RuleScribe</title>
    <meta
      name="description"
      content="Local-first editor and army list builder for tabletop wargame rulesets. Works fully offline; sign in only if you want sync or share links."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ec3013" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#201e1d" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RuleScribe" />
    <script>
      // Resolve the color scheme before first paint so dark users get no light
      // flash. Mirrors @mantine/core's ColorSchemeScript: same localStorage key
      // and the html[data-mantine-color-scheme] attribute MantineProvider reads.
      (function () {
        try {
          var stored = localStorage.getItem("mantine-color-scheme-value");
          var scheme = stored === "light" || stored === "dark" ? stored : "auto";
          var resolved =
            scheme === "auto"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : scheme;
          document.documentElement.setAttribute("data-mantine-color-scheme", resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
